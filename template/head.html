<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="아침 브리핑">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f3552">
<title>{{TITLE}}</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 단일 세로 칼럼(모바일 우선), 상단 고정 섹터 바, 섹터별 3개 기사 목록. 색은 잉크 한 가지만. */
:root{
  --bg:#f7f7f5; --surface:#ffffff; --fg:#1c1d1f; --muted:#6b6e73; --line:#e3e3e0; --ink:#2f4a6b; --up:#d0343a; --down:#2a62c9; --flat:#8a8d92; --aq1:#2f9e5b; --aq2:#9a9ca0; --aq3:#d9a514; --aq4:#d0343a;
  --font-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141516; --surface:#1b1c1e; --fg:#e7e7e4; --muted:#9a9da2; --line:#2c2e31; --ink:#9db4d1; --up:#ff6b6b; --down:#6e9bff; --flat:#8e9196; --aq1:#4cc27d; --aq2:#a4a7ab; --aq3:#f0c341; --aq4:#ff6b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141516; --surface:#1b1c1e; --fg:#e7e7e4; --muted:#9a9da2; --line:#2c2e31; --ink:#9db4d1; --up:#ff6b6b; --down:#6e9bff; --flat:#8e9196; --aq1:#4cc27d; --aq2:#a4a7ab; --aq3:#f0c341; --aq4:#ff6b6b; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:680px;margin:0 auto}

header.top{padding-block:28px 16px;display:grid;gap:12px}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar button{background:none;border:1px solid var(--line);color:var(--fg);width:36px;height:36px;border-radius:6px;font-size:16px;cursor:pointer}
.datebar button:disabled{color:var(--muted);opacity:.5;cursor:default}
.datebar button:focus-visible,.sectors a:focus-visible,.variant button:focus-visible,.card a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.date{text-align:center;display:grid;gap:2px;min-width:0}

.date strong{font-size:36px;line-height:1.2;font-weight:600;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.date span{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.summary{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center}
.summary b{color:var(--fg);font-weight:500}
.notice{font-size:13px;border:1px solid var(--line);border-radius:6px;padding:8px 12px;color:var(--fg);background:var(--surface)}
.notice::before{content:"안내 ";font-weight:600;color:var(--ink)}
.sample{font-size:12px;color:var(--muted);text-align:center}

nav.sectors{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:8px 16px;overflow-x:auto;white-space:nowrap}
nav.sectors .row{display:flex;gap:6px;max-width:680px;margin:0 auto}
nav.sectors a{font-size:13px;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:999px;border:1px solid transparent}
nav.sectors a:hover{color:var(--fg);border-color:var(--line)}

section.sector{padding-block:28px 4px;scroll-margin-top:56px;display:grid;gap:12px}
.sector h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--muted);display:flex;align-items:baseline;gap:8px}
.sector h2 small{font-weight:400;letter-spacing:0;font-size:12px}
.list{display:grid;border-top:1px solid var(--fg)}
.card{padding-block:14px;border-bottom:1px solid var(--line);display:grid;gap:4px;min-width:0}
.meta{font-family:var(--font-mono);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-variant-numeric:tabular-nums}
.tag{font-family:var(--font-body);font-size:11px;font-weight:500;color:var(--ink);border:1px solid currentColor;border-radius:3px;padding:0 5px;line-height:18px}
.old{font-family:var(--font-body);font-size:11px;color:var(--muted);border:1px dashed var(--muted);border-radius:3px;padding:0 5px;line-height:18px}
.card a{color:var(--fg);text-decoration:none;font-size:16px;font-weight:600;line-height:1.45;text-wrap:balance}
.card a:hover{text-decoration:underline;text-decoration-color:var(--ink);text-underline-offset:3px}
.orig{font-size:13px;color:var(--muted);margin:0}
.card p.sum{margin:2px 0 0;font-size:14px;line-height:1.65;color:var(--fg);opacity:.86}

.variant{margin-top:36px;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:10px}
.variant p{margin:0;font-size:12px;color:var(--muted)}
.variant .btns{display:flex;flex-wrap:wrap;gap:6px}
.variant button{font:inherit;font-size:13px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.variant button[aria-pressed="true"]{border-color:var(--fg);font-weight:600}
footer{margin-top:24px;font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 10px 8px;display:grid;gap:4px;min-width:0}
.box .lbl{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;gap:4px;white-space:nowrap}
.box .big{font-size:15px;font-weight:600;line-height:1.3}
.box .sub{font-size:12px;color:var(--muted);line-height:1.45;font-variant-numeric:tabular-nums}
.box .val{font-family:var(--font-mono);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.box svg.spark{width:100%;height:30px;display:block}
.wx{display:flex;align-items:center;gap:6px}
.wx svg{width:28px;height:28px;flex:none;color:var(--fg)}
.strip-cap{font-size:11px;color:var(--muted);text-align:right;margin-top:-4px}
@media (max-width:380px){.box{padding:8px 7px}.box .big{font-size:14px}}

.wxbox{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:10px}
.wxhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--muted)}
.wxmain{display:flex;align-items:center;gap:12px}
.wxmain svg{width:44px;height:44px;flex:none;color:var(--fg)}
.wxmain .st{font-size:16px;font-weight:600;line-height:1.35}
.wxmain .tp{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.wxrows{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px}
.wxrows span b{font-weight:600}
.wxrows .k{color:var(--muted);margin-right:4px}
.box .num{font-family:var(--font-mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box .num.na{font-family:var(--font-body);font-size:12px;font-weight:400}

.wxhead .hl{color:var(--fg);font-family:var(--font-mono);font-size:13px;font-variant-numeric:tabular-nums}
.wxlines{display:grid;gap:6px}
.wxline{display:grid;grid-template-columns:24px 34px minmax(0,1fr);align-items:center;gap:8px;font-size:14px}
.wxline svg{width:24px;height:24px;color:var(--fg)}
.wxline .when{font-size:12px;color:var(--muted)}
.wxgrid{border-top:1px solid var(--line);padding-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:13px}
.wxgrid div{display:flex;justify-content:space-between;gap:8px;min-width:0}
.wxgrid .k{color:var(--muted)}
.wxgrid b{font-weight:600;font-variant-numeric:tabular-nums}
.wxgrid .na{font-weight:400;color:var(--muted);font-size:12px}
.wxsrc{font-size:11px;color:var(--muted)}

.wxhead{align-items:center}
.wxhead .city{font-size:20px;font-weight:700;color:var(--fg);letter-spacing:.02em}
.wxhead .hl{font-family:var(--font-mono);font-size:18px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.wxline{grid-template-columns:40px 34px minmax(0,1fr);font-size:15px}
.wxline svg{width:40px;height:40px}
.aq{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.aq::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.aq.g1{--c:var(--aq1)} .aq.g2{--c:var(--aq2)} .aq.g3{--c:var(--aq3)} .aq.g4{--c:var(--aq4)}
.wxgrid .obs{font-size:11px;color:var(--muted);font-weight:400;margin-left:4px}
.box .num{color:var(--fg)}
.example{font-size:12px;color:var(--muted);margin:0}

.ctabs{display:flex;flex-wrap:wrap;gap:6px}
.ctabs button{font:inherit;font-size:13px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 14px;cursor:pointer}
.ctabs button[aria-pressed="true"]{border-color:var(--fg);font-weight:600}
.ctabs button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.sector h2{font-size:20px;font-weight:700;color:var(--fg);letter-spacing:.02em}
.date strong{font-size:clamp(20px,5.6vw,32px)!important;white-space:nowrap;line-height:1.25}
.datebar button{width:32px;height:32px;flex:none}
.tag.fill{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.due{font-family:var(--font-body);font-size:11px;font-weight:600;color:var(--fg);border:1px solid var(--fg);border-radius:3px;padding:0 5px;line-height:18px}
.date strong{margin-block:6px}
.date .round{font-family:var(--font-body);font-size:12px;color:var(--muted);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.meta .tm{font-size:11px;opacity:.85}
.datebar a.nav{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex:none;border:1px solid var(--line);border-radius:6px;color:var(--fg);text-decoration:none;font-size:16px}
.datebar .nav.off{color:var(--muted);opacity:.5;pointer-events:none}
.empty{font-size:13px;color:var(--muted);padding-block:14px}
</style>
</head>
<body>
